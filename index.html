<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sana Bir Mektup 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF3EF;
    --plum:#3D1B33;
    --rose:#E85C7B;
    --rose-deep:#C93F62;
    --rose-light:#FFD9E1;
    --gold:#F2A65A;
    --white:#FFFFFF;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body{ height:100%; }

  body{
    margin:0;
    height:100dvh;
    background:
      radial-gradient(circle at 15% 20%, #ffe3da 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #ffd7e2 0%, transparent 45%),
      var(--cream);
    font-family:'Quicksand', sans-serif;
    color:var(--plum);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* ---------- Ambient floating decorations ---------- */
  .bg-hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .bg-hearts span{
    position:absolute;
    bottom:-10%;
    font-size:18px;
    opacity:0.4;
    animation:floatUp linear infinite;
  }
  .bg-hearts img{
    position:absolute;
    bottom:-15%;
    width:30px;
    height:30px;
    object-fit:contain;
    opacity:0.55;
    animation:floatUp linear infinite;
    filter:drop-shadow(0 2px 5px rgba(201,63,98,0.25));
  }
  @keyframes floatUp{
    to{ transform:translateY(-125vh) rotate(25deg); opacity:0; }
  }

  h1,h2,h3{
    font-family:'Baloo 2', sans-serif;
    margin:0;
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    height:100%;
  }

  .scene{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:20px;
    opacity:0;
    transform:scale(0.94);
    transition:opacity 0.5s ease, transform 0.5s ease;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  }

  .scene.active{
    display:flex;
    opacity:1;
    transform:scale(1);
  }

  /* ---------- Corner stickers (GIF) ---------- */
  .corner-sticker{
    position:absolute;
    width:54px;
    height:54px;
    object-fit:contain;
    pointer-events:none;
    animation:bobble 3s ease-in-out infinite;
    filter:drop-shadow(0 4px 10px rgba(201,63,98,0.3));
    z-index:2;
  }
  .corner-sticker.tl{ top:16px; left:12px; }
  .corner-sticker.tr{ top:16px; right:12px; animation-delay:0.6s; }
  @keyframes bobble{
    0%,100%{ transform:translateY(0) rotate(-6deg); }
    50%{ transform:translateY(-10px) rotate(6deg); }
  }

  /* ---------- Sparkle title ---------- */
  .sparkle-wrap{ position:relative; display:inline-block; }
  .title.sparkle{
    animation:titleGlow 2.2s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%,100%{ text-shadow:0 0 0px rgba(232,92,123,0); }
    50%{ text-shadow:0 0 16px rgba(232,92,123,0.4); }
  }
  .spark{
    position:absolute;
    font-size:14px;
    animation:twinkle 1.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(0.5) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.1) rotate(20deg); }
  }

  /* ---------- Love meter (signature element) ---------- */
  .meter-wrap{
    position:relative;
    width:110px;
    height:100px;
  }
  .meter-wrap svg{ position:absolute; inset:0; width:100%; height:100%; }
  #meterFill{
    transition:transform 0.8s cubic-bezier(.34,1.56,.64,1);
    transform:translateY(100%);
    transform-box:fill-box;
    transform-origin:bottom;
  }
  .meter-label{
    font-family:'Baloo 2', sans-serif;
    font-size:13px;
    color:var(--rose-deep);
    letter-spacing:0.5px;
  }

  /* ---------- Buttons ---------- */
  button{
    font-family:'Baloo 2', sans-serif;
    font-size:16px;
    border:none;
    border-radius:999px;
    padding:14px 30px;
    cursor:pointer;
    background:var(--rose);
    color:var(--white);
    box-shadow:0 6px 0 var(--rose-deep);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--rose-deep); }
  button:hover{ filter:brightness(1.05); }

  .opt-btn{
    background:var(--white);
    color:var(--plum);
    box-shadow:0 4px 0 #e8c9c0;
    width:100%;
    text-align:left;
    padding:14px 20px;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:15px;
  }
  .opt-btn:hover{ background:var(--rose-light); }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    max-width:340px;
  }

  /* ---------- Intro / Song ---------- */
  .eyebrow{
    font-family:'Baloo 2', sans-serif;
    font-size:13px;
    letter-spacing:2px;
    color:var(--rose-deep);
    text-transform:uppercase;
  }
  .title{
    font-size:34px;
    color:var(--plum);
    line-height:1.15;
  }

  .song-box{
    width:100%;
    max-width:320px;
    background:var(--white);
    border-radius:20px;
    padding:14px;
    box-shadow:0 10px 24px rgba(201,63,98,0.18);
  }
  .song-box iframe{
    width:100%;
    height:170px;
    border:none;
    border-radius:14px;
  }

  /* ---------- Quiz ---------- */
  .question{
    font-size:20px;
    max-width:340px;
    line-height:1.4;
  }
  .progress-dots{
    display:flex;
    gap:8px;
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background:#f3cdd6;
    transition:background 0.3s ease, transform 0.3s ease;
  }
  .dot.done{ background:var(--rose); transform:scale(1.2); }

  /* ---------- Reveal ---------- */
  .message-card{
    background:var(--white);
    border-radius:24px;
    padding:28px 26px;
    max-width:360px;
    box-shadow:0 12px 30px rgba(201,63,98,0.15);
    font-size:16px;
    line-height:1.6;
    color:#5c3a4b;
  }
  .message-card b{ color:var(--rose-deep); }

  .yn-row{
    position:relative;
    display:flex;
    gap:16px;
    align-items:center;
    justify-content:center;
    width:100%;
    height:70px;
  }
  #noBtn{
    background:var(--white);
    color:#a5798a;
    box-shadow:0 4px 0 #e8c9c0;
    position:relative;
    transition:transform 0.18s ease;
  }
  #yesBtn{ font-size:calc(16px + var(--grow, 0) * 2px); }

  /* ---------- Final ---------- */
  .final-msg{
    font-size:22px;
    max-width:320px;
    line-height:1.5;
  }
  .heart-burst{
    font-size:44px;
  }

  .confetti{
    position:fixed;
    top:-40px;
    font-size:20px;
    pointer-events:none;
    animation: fall linear forwards;
    z-index:5;
  }
  .confetti img{ width:26px; height:26px; object-fit:contain; }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0.2; }
  }

  /* ---------- XOX game ---------- */
  .ttt-board{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    width:240px;
  }
  .ttt-cell{
    aspect-ratio:1/1;
    background:var(--white);
    border-radius:14px;
    box-shadow:0 4px 0 #e8c9c0;
    font-family:'Baloo 2', sans-serif;
    font-size:32px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--rose-deep);
    padding:0;
  }
  .ttt-cell:disabled{ cursor:default; }
  .ttt-cell:not(:disabled):hover{ background:var(--rose-light); }
  .ttt-cell.win-heart{
    background:var(--rose-light);
    animation:heartPop 0.4s ease;
  }
  @keyframes heartPop{
    0%{ transform:scale(0.7); }
    60%{ transform:scale(1.15); }
    100%{ transform:scale(1); }
  }
  .ttt-status{
    font-family:'Baloo 2', sans-serif;
    font-size:15px;
    color:var(--rose-deep);
    min-height:20px;
  }

  /* ---------- Letter / envelope ---------- */
  .envelope{
    position:relative;
    width:180px;
    height:120px;
    cursor:pointer;
  }
  .envelope .body{
    position:absolute;
    inset:0;
    background:var(--rose-light);
    border-radius:10px;
    box-shadow:0 8px 20px rgba(201,63,98,0.2);
  }
  .envelope .flap{
    position:absolute;
    top:0; left:0; right:0;
    height:0;
    border-left:90px solid transparent;
    border-right:90px solid transparent;
    border-top:66px solid #ffc4d3;
    transform-origin:top;
    transition:transform 0.5s ease;
    z-index:2;
  }
  .envelope.open .flap{ transform:rotateX(180deg); }
  .envelope .seal{
    position:absolute;
    top:44px; left:50%;
    transform:translateX(-50%);
    font-size:26px;
    z-index:3;
  }
  .envelope-hint{
    font-size:13px;
    color:#a5798a;
  }
  .letter-card{
    display:none;
    background:var(--white);
    border-radius:20px;
    padding:26px 24px;
    max-width:360px;
    box-shadow:0 12px 30px rgba(201,63,98,0.15);
    font-size:15px;
    line-height:1.7;
    color:#5c3a4b;
    text-align:left;
  }
  .letter-card.show{ display:block; }
  .letter-sticker{
    display:none;
    width:110px;
  }
  .letter-sticker.show{ display:block; }

  @media (prefers-reduced-motion: reduce){
    .scene{ transition:none; }
    #meterFill{ transition:none; }
    .confetti{ display:none; }
    .envelope .flap{ transition:none; }
    .corner-sticker, .bg-hearts span, .bg-hearts img, .title.sparkle, .spark{ animation:none; }
  }
</style>
</head>
<body>

<div class="bg-hearts" aria-hidden="true">
  <span style="left:6%; animation-duration:9s; animation-delay:0s;">💗</span>
  <span style="left:18%; animation-duration:12s; animation-delay:2s; font-size:14px;">💕</span>
  <span style="left:32%; animation-duration:10s; animation-delay:4s;">✨</span>
  <span style="left:46%; animation-duration:13s; animation-delay:1s; font-size:15px;">💖</span>
  <span style="left:60%; animation-duration:11s; animation-delay:3s;">💗</span>
  <span style="left:72%; animation-duration:14s; animation-delay:5s; font-size:14px;">💕</span>
  <span style="left:85%; animation-duration:10s; animation-delay:2.5s;">✨</span>
  <span style="left:94%; animation-duration:12.5s; animation-delay:0.5s; font-size:16px;">💘</span>
  <img src="https://media.giphy.com/media/gfBGaEKYFQ7Ys4OdLh/giphy.gif" style="left:12%; animation-duration:15s; animation-delay:1.5s;" alt="">
  <img src="https://media.giphy.com/media/aZR0etkZZYdl1GphOW/giphy.gif" style="left:52%; animation-duration:16s; animation-delay:3.5s;" alt="">
  <img src="https://media.giphy.com/media/1oPXuHfr7oA5MsesEl/giphy.gif" style="left:80%; animation-duration:17s; animation-delay:0.8s;" alt="">
</div>

<div class="stage">

  <!-- SCENE 1: INTRO -->
  <section class="scene active" id="scene-intro">
    <img class="corner-sticker tl" src="https://media.giphy.com/media/gfBGaEKYFQ7Ys4OdLh/giphy.gif" alt="">
    <img class="corner-sticker tr" src="https://media.giphy.com/media/aZR0etkZZYdl1GphOW/giphy.gif" alt="">
    <div class="sparkle-wrap">
      <span class="spark" style="top:-10px; left:-18px; animation-delay:0s;">✨</span>
      <span class="spark" style="top:-6px; right:-20px; animation-delay:0.8s;">✨</span>
      <h1 class="title sparkle" style="font-size:42px;">Sana Bir Mektup 💌</h1>
    </div>
    <button onclick="goTo('song')">Hadi başlayalım ✨</button>
  </section>

  <!-- SCENE 1.4: SONG -->
  <section class="scene" id="scene-song">
    <img class="corner-sticker tl" src="https://media.giphy.com/media/1oPXuHfr7oA5MsesEl/giphy.gif" alt="">
    <div class="eyebrow">Başlamadan önce...</div>
    <h2 class="title sparkle" style="font-size:22px;">🎵 Sana bir şarkı</h2>
    <div class="song-box" id="songBox">
      <div style="width:100%; max-width:560px; margin:0 auto;">
        <audio id="songPlayer" preload="metadata" controls style="width:100%;">
          <source src="music.mp3" type="audio/mpeg">
          Tarayıcın ses oynatmayı desteklemiyor.
        </audio>
      </div>
      <button id="playSongBtn" onclick="playMP3()" style="margin-top:14px;">▶ Şarkıyı çal</button>
    </div>

    <p class="question" id="questionText"></p>
    <div class="options" id="optionsWrap"></div>
  </section>

  <!-- SCENE 3: REVEAL (message + yes/no) -->
  <section class="scene" id="scene-reveal">
    <img class="corner-sticker tr" src="https://media.giphy.com/media/iweiYz7dASKc5a6VoS/giphy.gif" alt="">
    <div class="heart-burst">💗</div>
    <div class="message-card" id="messageCard"></div>
    <div class="yn-row" id="ynRow">
      <button id="yesBtn" onclick="goTo('final')">Tamam, ben varım! 🥺</button>
      <button id="noBtn">Yok ya, şimdilik olmasın</button>
    </div>
  </section>

  <!-- SCENE 4: FINAL -->
  <section class="scene" id="scene-final">
    <img class="corner-sticker tl" src="https://media.giphy.com/media/SYZ5yGmIDvzJdcbJWm/giphy.gif" alt="">
    <img class="corner-sticker tr" src="https://media.giphy.com/media/3ov9k67EjtsH4n8520/giphy.gif" alt="">
    <div class="heart-burst">🎉💖</div>
    <p class="final-msg" id="finalMsg"></p>
    <button onclick="goTo('letter')">Bir şey daha var 💌</button>
  </section>

  <!-- SCENE 5: SURPRISE LETTER -->
  <section class="scene" id="scene-letter">
    <div class="envelope" id="envelope" onclick="openLetter()">
      <div class="flap"></div>
      <div class="seal">💗</div>
      <div class="body"></div>
    </div>
    <div class="envelope-hint" id="envelopeHint">Zarfı açmak için dokun 💌</div>
    <div class="letter-card" id="letterCard"></div>
    <img class="letter-sticker" id="letterSticker" src="https://media.giphy.com/media/1oPXuHfr7oA5MsesEl/giphy.gif" alt="">
  </section>

</div>


<script>
  /* ======= EDIT BAGIAN INI SESUAI KEBUTUHANMU ======= */
  const CONFIG = {
    partnerName: "Sen",
    senderName: "Ben",
    questions: [
      {
        text: "Gün içinde durup dururken birini düşünüyorsan, genelde sebebi...",
        options: ["Bir anda özlemişsindir", "Onunla yaşadığın komik bir şeyi hatırlamışsındır", "Çünkü o kişi fark etmeden aklına sürekli geliyordur"]
      },
      {
        text: "Sence biri mesajlarına hep anında cevap veriyorsa, bu ne demek?",
        options: ["Gerçekten önemsiyordur", "Sadece sürekli online'dır", "Belki de birinin mesajını bekliyordur"]
      },
      {
        text: "Bir anı tekrar tekrar yaşayabilseydin, hangisini seçerdin?",
        options: ["Kahkaha attığın bir anı", "Kalbinin hızla attığı bir anı", "Doğru kişiyle olduğun bir anı"]
      }
    ],
    revealMessage: `Aslında, <b>sana bir şey söylemek istiyorum...</b> 💗<br><br>
      Hayatıma girdiğin için teşekkür ederim.<br><br>
      Sen olunca sıradan günler bile biraz daha güzel geliyor.<br><br>
      O yüzden...<br>
      <b>Benim Valentine'ım olur musun?</b> 💌`,
    finalMessage: `Yaşasın! 🎉<br>
      Teşekkür ederim, kabul ettiğin için.<br><br>
      Umarım bundan sonra da<br>
      birlikte bol bol güzel anımız olur.<br><br>
      Sevgililer Günü kutlu olsun 💌<br>
      — Ben`,
    letterMessage: `Sana:<br><br>
      Açıkçası bu hissettiğim şeyi nasıl anlatacağımı pek bilmiyorum.<br>
      Sadece seni tanıdıktan sonra seninle konuşmak,<br>
      küçük şeyleri paylaşmak benim için giderek daha güzel bir şey oldu.<br><br>
      O yüzden bu küçük siteyi yaptım.<br>
      Çok büyük bir sebebi yok aslında,<br>
      sadece bu özel günde sana küçük bir şey bırakmak istedim.<br><br>
      Umarım buraya geldiğinde<br>
      yüzünde küçük bir gülümseme oluşur.<br><br>
      Sevgililer Günü kutlu olsun 💗<br>
      — Ben`,
    youtubeVideoId: ""
  };
  /* ==================================================== */

  let progress = 0;
  const totalQ = CONFIG.questions.length;

  function goTo(scene){
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    document.getElementById('scene-' + scene).classList.add('active');
    if(scene === 'song'){ startSong(); }
    if(scene === 'xox'){ initTTT(); }
    if(scene === 'quiz'){ renderQuestion(0); }
    if(scene === 'reveal'){ renderReveal(); launchConfetti(['✨','💗','💫'], 14); }
    if(scene === 'final'){ renderFinal(); }
  }

  function startSong(){
    launchConfetti(['🎵','✨','💗'], 10);
  }

  function playMP3(){
    const audio = document.getElementById('songPlayer');
    const btn = document.getElementById('playSongBtn');

    if(audio){
      audio.play().then(() => {
        if(btn) btn.textContent = '❚❚ Şarkıyı durdur';
      }).catch(() => {
        if(btn) btn.textContent = '▶ Tekrar çal';
      });

      audio.onpause = function(){
        if(btn) btn.textContent = '▶ Şarkıyı çal';
      };
    }
  } else {
      const btn = document.getElementById('playSongBtn');
      if(btn) btn.textContent = 'Bir saniye... 🎵';
    }
  }

    cover.style.display = 'none';
    player.style.display = 'block';
  }

  let qIndex = 0;
  function renderQuestion(i){
    qIndex = i;
    const q = CONFIG.questions[i];
    document.getElementById('questionText').textContent = q.text;
    const wrap = document.getElementById('optionsWrap');
    wrap.innerHTML = '';
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.onclick = () => answer(i);
      wrap.appendChild(btn);
    });
    for(let d=0; d<totalQ; d++){
      document.getElementById('dot'+d).classList.toggle('done', d < i);
    }
  }

  function answer(i){
    progress = Math.round(((i+1)/totalQ) * 100);
    const fillEl = document.getElementById('meterFill');
    fillEl.style.transform = `translateY(${100 - progress}%)`;
    document.getElementById('meterLabel').textContent = `Love-o-meter: ${progress}%`;
    document.getElementById('dot'+i).classList.add('done');

    setTimeout(() => {
      if(i + 1 < totalQ){
        renderQuestion(i+1);
      } else {
        goTo('reveal');
      }
    }, 450);
  }

  function renderReveal(){
    const msg = CONFIG.revealMessage
      .replace('PARTNER', CONFIG.partnerName)
      .replace('SENDER', CONFIG.senderName);
    document.getElementById('messageCard').innerHTML = msg;
    setupDodgeButton();
  }

  function renderFinal(){
    const msg = CONFIG.finalMessage
      .replace('PARTNER', CONFIG.partnerName)
      .replace('SENDER', CONFIG.senderName);
    document.getElementById('finalMsg').innerHTML = msg;
    launchConfetti(['💖','💗','💕','💘','✨','🎉'], 30);
  }

  /* ---------- XOX (tic-tac-toe) ---------- */
  let tttCells = [];
  let tttOver = false;
  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  function initTTT(){
    tttCells = Array(9).fill(null);
    tttOver = false;
    document.getElementById('tttStatus').textContent = 'Önce sen başla (X)';
    document.getElementById('tttNextBtn').style.display = 'none';

    const board = document.getElementById('tttBoard');
    board.innerHTML = '';
    for(let i=0; i<9; i++){
      const btn = document.createElement('button');
      btn.className = 'ttt-cell';
      btn.onclick = () => playerMove(i);
      board.appendChild(btn);
    }
  }

  function renderTTT(){
    const board = document.getElementById('tttBoard');
    [...board.children].forEach((cell, i) => {
      cell.textContent = tttCells[i] || '';
      cell.disabled = !!tttCells[i] || tttOver;
    });
  }

  function playerMove(i){
    if(tttOver || tttCells[i]) return;
    tttCells[i] = 'X';
    renderTTT();
    const result = checkTTT();
    if(result){ endTTT(result); return; }
    document.getElementById('tttStatus').textContent = 'Sıra bende...';
    setTimeout(computerMove, 500);
  }

  function computerMove(){
    if(tttOver) return;
    const empty = tttCells.map((v,i)=>v?null:i).filter(v=>v!==null);
    if(empty.length === 0) return;
    const pick = empty[Math.floor(Math.random()*empty.length)];
    tttCells[pick] = 'O';
    renderTTT();
    const result = checkTTT();
    if(result){ endTTT(result); return; }
    document.getElementById('tttStatus').textContent = 'Sıra sende (X)';
  }

  function checkTTT(){
    for(const line of WIN_LINES){
      const [a,b,c] = line;
      if(tttCells[a] && tttCells[a] === tttCells[b] && tttCells[a] === tttCells[c]){
        return { winner: tttCells[a], line };
      }
    }
    if(tttCells.every(v => v)) return { winner: 'draw', line: null };
    return null;
  }

  function endTTT(result){
    tttOver = true;
    renderTTT();
    const status = document.getElementById('tttStatus');
    if(result.winner === 'X'){
      status.textContent = 'Kazandın! 🎉';
      const board = document.getElementById('tttBoard');
      result.line.forEach(i => {
        const cell = board.children[i];
        cell.textContent = '💗';
        cell.classList.add('win-heart');
      });
      launchConfetti(['💗','✨','🎉'], 18);
    }
    else if(result.winner === 'O') status.textContent = 'Bu sefer ben kazandım 😆';
    else status.textContent = 'Berabere! 🤝';
    document.getElementById('tttNextBtn').style.display = 'inline-block';
  }

  /* ---------- Surprise letter ---------- */
  function openLetter(){
    const envelope = document.getElementById('envelope');
    if(envelope.classList.contains('open')) return;
    envelope.classList.add('open');
    document.getElementById('envelopeHint').style.display = 'none';

    const letterMsg = CONFIG.letterMessage
      .replace(/PARTNER/g, CONFIG.partnerName)
      .replace(/SENDER/g, CONFIG.senderName);

    setTimeout(() => {
      const card = document.getElementById('letterCard');
      card.innerHTML = letterMsg;
      card.classList.add('show');
      document.getElementById('letterSticker').classList.add('show');
      launchConfetti(['💌','💗','✨','💕'], 24);
    }, 550);
  }

  /* ---------- "No" button dodges the cursor ---------- */
  let dodgeCount = 0;
  function setupDodgeButton(){
    const noBtn = document.getElementById('noBtn');
    const row = document.getElementById('ynRow');
    noBtn.style.position = 'static';

    function dodge(){
      dodgeCount++;
      const rowRect = row.getBoundingClientRect();
      const maxX = Math.max(rowRect.width - 140, 40);
      const maxY = 160;
      const x = (Math.random() - 0.5) * maxX;
      const y = (Math.random() - 0.5) * maxY;
      noBtn.style.position = 'relative';
      noBtn.style.transform = `translate(${x}px, ${y}px)`;

      const yesBtn = document.getElementById('yesBtn');
      const grow = Math.min(dodgeCount, 6);
      yesBtn.style.setProperty('--grow', grow);

      const shrink = Math.max(1 - dodgeCount * 0.06, 0.55);
      noBtn.style.fontSize = (16 * shrink) + 'px';
    }

    noBtn.addEventListener('mouseenter', dodge);
    noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodge(); }, {passive:false});
    noBtn.addEventListener('click', (e) => { e.preventDefault(); dodge(); });
  }

  /* ---------- confetti / sparkle burst (reusable) ---------- */
  function launchConfetti(items, count){
    items = items || ['💖','💗','💕','💘','✨'];
    count = count || 26;
    for(let i=0; i<count; i++){
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.textContent = items[Math.floor(Math.random()*items.length)];
        el.style.left = Math.random()*100 + 'vw';
        el.style.animationDuration = (2.5 + Math.random()*2) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 5000);
      }, i * 80);
    }
  }
</script>
